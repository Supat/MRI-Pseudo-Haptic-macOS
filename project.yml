# XcodeGen project specification.
# Run `xcodegen generate` to produce MRIPseudoHaptic.xcodeproj.
name: MRIPseudoHaptic
options:
  bundleIdPrefix: com.mri.pseudohaptic
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/VimbaX.xcconfig
  Release: Config/VimbaX.xcconfig

packages:
  MediaPipeTasksVision:
    # MediaPipe Tasks Vision is distributed as a prebuilt xcframework.
    # Either vendor the framework in ThirdParty/MediaPipe or consume it via CocoaPods.
    # When using SwiftPM, point at the community mirror that wraps the framework.
    url: https://github.com/google-ai-edge/mediapipe
    branch: master

targets:
  MRIPseudoHaptic:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: MRIPseudoHaptic
        excludes:
          - "Support/Info.plist"
          - "Support/MRIPseudoHaptic.entitlements"
    resources:
      - path: Models
        optional: true
    info:
      path: MRIPseudoHaptic/Support/Info.plist
      properties:
        CFBundleName: MRI Pseudo Haptic
        CFBundleDisplayName: MRI Pseudo Haptic
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSCameraUsageDescription: "Used to capture frames from the GigE machine vision camera."
        NSLocalNetworkUsageDescription: "Used to discover and stream from GigE Vision cameras."
        NSHighResolutionCapable: true
    entitlements:
      path: MRIPseudoHaptic/Support/MRIPseudoHaptic.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
    configFiles:
      Debug: Config/VimbaX.xcconfig
      Release: Config/VimbaX.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mri.pseudohaptic.app
        SWIFT_VERSION: "5.9"
        CLANG_ENABLE_MODULES: YES
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_OBJC_BRIDGING_HEADER: MRIPseudoHaptic/Support/MRIPseudoHaptic-Bridging-Header.h
        # Vimba X SDK search paths come from Config/VimbaX.xcconfig.
        # Edit that file to point at your local VIMBA_X_HOME.
    dependencies:
      - sdk: AppKit.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Network.framework
      - sdk: Accelerate.framework
